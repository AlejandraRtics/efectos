<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efectos</title>
    <link rel="stylesheet" href="efectos.css">
</head>
<body>
    <button id="boton">Efecto transición</button>
    <button id="botonhover">Efecto hover</button>
    <button class="tarjeta">Keyframes</button>
    <button class="tarjet">Keyframes 2</button>
    <style>
#boton {
background: #d34bb6;
transition: background .3s ease, transform .3s ease;
}
#botonhover:hover {
background: #7e0a0f;
transform: translateY(-3px);
box-shadow: 0 6px 14px rgba(211, 25, 25, 0.35);
}
@keyframes aparecer {
from { opacity:0; transform:translateY(20px); }
to { opacity:1; transform:translateY(0); }
}
.tarjeta {
animation: aparecer .6s ease-out;
}
@keyframes pulso {
0%, 100% { transform:scale(1); }
50% { transform:scale(1.06); }
}
.tarjet {
animation: pulso 1.5s ease-in-out infinite;
}
    </style>
</body>
</html>
